name: Build cPanel Static Site

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'cpanel-dist/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build:cpanel

      - name: Prepare cPanel files
        run: |
          rm -rf cpanel-dist
          mkdir -p cpanel-dist
          cp -a out/. cpanel-dist/
          test -f cpanel-dist/index.html

      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cpanel-dist
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Atualiza build estático do cPanel [skip ci]"
            git push
          fi
